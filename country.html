<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title id="pageTitle">Country — The Future Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f7f7f5;--text:#1a1a1a;--text2:#6b6b68;--border:rgba(0,0,0,.1);--accent:#1a4a8a;--acl:#e8f0fa;--acm:#2d6ec2}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#1e2028;--text:#f0ede8;--text2:#9a9992;--border:rgba(255,255,255,.1);--accent:#2d6ec2;--acl:#0d1e3a;--acm:#5b9de8}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:16px}
nav{position:sticky;top:0;z-index:500;background:var(--bg);border-bottom:.5px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:15px;font-weight:500;color:var(--text);text-decoration:none;letter-spacing:-.01em}
.nav-logo span{color:var(--acm)}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{font-size:14px;color:var(--text2);text-decoration:none;transition:color .15s}
.nav-links a:hover{color:var(--text)}
.breadcrumb{max-width:1100px;margin:0 auto;padding:1.5rem 2rem 0;display:flex;align-items:center;gap:.5rem;font-size:13px;color:var(--text2)}
.breadcrumb a{color:var(--acm);text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.header{max-width:1100px;margin:0 auto;padding:1.5rem 2rem 1.5rem}
.header-flag{width:56px;height:40px;border-radius:6px;object-fit:cover;box-shadow:0 0 0 .5px rgba(0,0,0,.15);margin-bottom:.75rem;background:var(--bg2)}
.header h1{font-size:2rem;font-weight:500;letter-spacing:-.02em;margin-bottom:.75rem}
.header-overview{font-size:15px;color:var(--text2);line-height:1.8;max-width:640px}
.header-stats{display:flex;gap:8px;margin-top:1.25rem;flex-wrap:wrap}
.hstat{background:var(--bg2);border:.5px solid var(--border);border-radius:10px;padding:8px 14px;text-align:center;min-width:90px}
.hstat span{display:block;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.03em;color:var(--text2);opacity:.8;margin-bottom:2px}
.hstat strong{font-size:15px;font-weight:600;color:var(--text)}
/* BIG MAP BLOCK — isolated stacking context so Leaflet panes never escape above nav */
.country-map-block{max-width:1100px;margin:0 auto 1rem;padding:0 2rem}
.map-frame{position:relative;isolation:isolate;z-index:0;width:100%;height:440px;border-radius:16px;overflow:hidden;border:.5px solid var(--border);background:var(--bg2)}
#countryMap{width:100%;height:100%}
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom a{background:var(--bg) !important;color:var(--text) !important;border-color:var(--border) !important}
.province-tooltip{background:var(--bg)!important;color:var(--text)!important;border:.5px solid var(--border)!important;border-radius:6px!important;font-family:inherit!important;font-size:12px!important;font-weight:500!important;padding:4px 9px!important;box-shadow:0 2px 8px rgba(0,0,0,.12)!important}
.province-tooltip::before{display:none!important}
.map-caption{font-size:12px;color:var(--text2);margin-top:.6rem;opacity:.8}
.container{max-width:1100px;margin:0 auto;padding:0 2rem 5rem}
.section-label{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--acm);margin:3rem 0 1rem;padding-top:2rem;border-top:.5px solid var(--border)}
.section-label:first-of-type{border-top:none;margin-top:0;padding-top:0}
.section-text{font-size:14.5px;color:var(--text2);line-height:1.85;max-width:760px}
.section-text+.section-text{margin-top:1rem}
/* Energy: radial meter + bars side by side */
.energy-layout{display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap;margin-top:1.25rem}
.radial-meter{flex-shrink:0;text-align:center}
.radial-meter span{display:block;font-size:11px;color:var(--text2);margin-top:.5rem;max-width:120px}
.energy-bars{display:flex;flex-direction:column;gap:8px;flex:1;min-width:240px}
.ebar-row{display:flex;align-items:center;gap:10px}
.ebar-label{font-size:12.5px;color:var(--text2);width:90px;flex-shrink:0}
.ebar-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.ebar-fill{height:100%;background:var(--acm);border-radius:4px}
.ebar-pct{font-size:12px;font-weight:500;color:var(--text);width:36px;text-align:right;flex-shrink:0}
/* Emissions comparison */
.compare-bars{display:flex;flex-direction:column;gap:10px;margin-top:1.25rem;max-width:520px}
.cbar-row{display:flex;flex-direction:column;gap:3px}
.cbar-top{display:flex;justify-content:space-between;font-size:12.5px}
.cbar-top span:first-child{color:var(--text2)}
.cbar-top span:last-child{font-weight:600;color:var(--text)}
.cbar-track{height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
.cbar-fill{height:100%;border-radius:5px}
/* Icon badges, reused for threats/facts/orgs */
.icon-badge{width:32px;height:32px;border-radius:8px;background:var(--acl);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-badge svg{width:16px;height:16px;stroke:var(--acm);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.threat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--border);border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin-top:1.25rem}
.threat-card{background:var(--bg);padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:.6rem}
.threat-card h4{font-size:13.5px;font-weight:500;color:var(--text)}
.threat-card p{font-size:13px;color:var(--text2);line-height:1.6}
/* Government timeline */
.gov-timeline{position:relative;margin-top:1.5rem;padding-left:1.75rem;max-width:700px}
.gov-timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--border)}
.gov-item{position:relative;padding-bottom:1.5rem}
.gov-item:last-child{padding-bottom:0}
.gov-dot{position:absolute;left:-1.75rem;top:4px;width:11px;height:11px;border-radius:50%;background:var(--acm);border:2px solid var(--bg)}
.gov-year{font-size:11px;font-weight:600;color:var(--acm);letter-spacing:.04em;margin-bottom:.25rem}
.gov-text{font-size:13.5px;color:var(--text2);line-height:1.7}
/* Initiatives with optional progress */
.init-block{margin-bottom:1.5rem}
.init-block:last-child{margin-bottom:0}
.init-title{font-size:14.5px;font-weight:500;color:var(--text);margin-bottom:.4rem}
.init-text{font-size:14px;color:var(--text2);line-height:1.8}
.init-progress{margin-top:.6rem;max-width:380px}
.init-progress-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text2);margin-bottom:4px}
.init-progress-track{height:7px;background:var(--bg2);border-radius:4px;overflow:hidden}
.init-progress-fill{height:100%;background:var(--acm);border-radius:4px}
/* People avatars */
.people-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--border);border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin-top:1.25rem}
.person-card{background:var(--bg);padding:1.5rem;display:flex;gap:1rem}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--acm);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0}
.person-info h4{font-size:14.5px;font-weight:500;color:var(--text);margin-bottom:.2rem}
.person-role{font-size:11.5px;color:var(--acm);font-weight:500;margin-bottom:.5rem}
.person-info p{font-size:13px;color:var(--text2);line-height:1.65}
/* Organizations */
.org-list{display:flex;flex-direction:column;gap:0;margin-top:1.25rem}
.org-row{display:flex;align-items:center;gap:.875rem;padding:.875rem 0;border-bottom:.5px solid var(--border)}
.org-row:first-child{border-top:.5px solid var(--border)}
.org-row-text{flex:1}
.org-row a{font-size:14px;font-weight:500;color:var(--text);text-decoration:none}
.org-row a:hover{color:var(--acm)}
.org-desc{font-size:12.5px;color:var(--text2);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:500;color:var(--acm);background:var(--acl);padding:4px 12px;border-radius:100px;flex-shrink:0}
/* Facts */
.fact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1.25rem}
.fact-card{background:var(--bg2);border-radius:12px;padding:1.25rem 1.5rem;display:flex;gap:.875rem;align-items:flex-start}
.fact-card p{font-size:13.5px;color:var(--text);line-height:1.65}
.source-note{font-size:11.5px;color:var(--text2);opacity:.7;margin-top:2.5rem;padding-top:1.5rem;border-top:.5px solid var(--border)}
.back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:14px;color:var(--acm);text-decoration:none;margin-top:2.5rem}
.back-link:hover{text-decoration:underline}
.researching{background:var(--bg2);border-radius:12px;padding:1.5rem 1.75rem;margin-top:1.25rem}
.researching p{font-size:13.5px;color:var(--text2);font-style:italic;line-height:1.7}
.not-found{max-width:1100px;margin:4rem auto;padding:0 2rem;text-align:center}
.not-found h1{font-size:1.5rem;font-weight:500;margin-bottom:.75rem}
.not-found p{color:var(--text2);font-size:14.5px}
footer{border-top:.5px solid var(--border);padding:2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;max-width:1100px;margin:0 auto}
footer p{font-size:13px;color:var(--text2)}
.footer-links{display:flex;gap:1.5rem;list-style:none}
.footer-links a{font-size:13px;color:var(--text2);text-decoration:none}
@media(max-width:700px){nav{padding:0 1rem}.nav-links{gap:1rem}.container{padding:0 1.25rem 3rem}.breadcrumb{padding:1.5rem 1.25rem 0}.header{padding:1.5rem 1.25rem}.country-map-block{padding:0 1.25rem}.map-frame{height:320px}.energy-layout{flex-direction:column}}
</style>
</head>

function getCode(p){let c=p.ISO_A3;if(!c||c==='-99')c=p.ADM0_A3;if(!c||c==='-99')c=p.ISO_A3_EH;return c}
function getName(p){let n=p.ADMIN||p.NAME_LONG||p.NAME_EN||p.NAME||p.name;if(!n||(n.length<=3&&n===n.toUpperCase()))n=p.NAME_LONG||p.SOVEREIGNT||'Unknown region';return n}
function getIso2(p){let i=p.ISO_A2||p.ISO_A2_EH;if(!i||i==='-99'||i.length!==2)return null;return i.toLowerCase()}
function initials(name){return name.split(' ').filter(w=>w.length).slice(0,2).map(w=>w[0]).join('').toUpperCase()}

if(!id){
  page.innerHTML = '<div class="not-found"><h1>No country specified</h1><p>Go back to the map and click a country to explore it.</p><a href="index.html#explore" class="back-link">&#8592; Back to the Map</a></div>';
} else {
  fetch('https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/50m/cultural/ne_50m_admin_0_countries.json')
    .then(r=>r.json())
    .then(worldData=>{
      const feat = worldData.features.find(f => getCode(f.properties) === id);
      if(!feat){
        page.innerHTML = '<div class="not-found"><h1>Country not found</h1><p>We couldn\'t find that country. Go back to the map and try again.</p><a href="index.html#explore" class="back-link">&#8592; Back to the Map</a></div>';
        return;
      }
      const stat = STATS[id];
      const research = RESEARCH[id];
      const name = stat ? stat.name : getName(feat.properties);
      const iso2 = stat ? stat.iso2 : getIso2(feat.properties);
      document.title = name + ' — The Future Map';
      document.getElementById('pageTitle').textContent = name + ' — The Future Map';

      const flagImg = iso2 ? `<img class="header-flag" src="https://flagcdn.com/w160/${iso2}.png" alt="${name} flag"/>` : '';
      const overview = research ? research.overview : (stat ? 'A deeper profile of ' + name + ' is being researched and will be added as The Future Map grows.' : name + ' is part of The Future Map\'s ongoing coverage. Detailed information is being researched and will be added soon.');

      const statsHtml = stat ? `
        <div class="hstat"><span>Population</span><strong>${stat.population}</strong></div>
        <div class="hstat"><span>Clean Energy Share</span><strong>${stat.cleanEnergy}</strong></div>
        <div class="hstat"><span>GHG / Capita (CO2e)</span><strong>${stat.ghg}</strong></div>
        ${research ? `<div class="hstat"><span>Net-Zero Target</span><strong>${research.netZero}</strong></div>` : ''}
      ` : `<div class="hstat"><span>Status</span><strong>Researching</strong></div>`;

      function researching(label){
        return `<p class="section-label">${label}</p><div class="researching"><p>This section for ${name} is still being researched and will be added as The Future Map grows.</p></div>`;
      }

      let sections = '';

      // Energy
      if(research){
        const r = 50, circ = 2*Math.PI*r;
        const offset = circ * (1 - research.cleanEnergyPct/100);
        const radial = `<div class="radial-meter"><svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--bg2)" stroke-width="10"/>
          <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--acm)" stroke-width="10" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" transform="rotate(-90 60 60)"/>
          <text x="60" y="58" text-anchor="middle" font-size="22" font-weight="600" fill="var(--text)" font-family="-apple-system,sans-serif">${research.cleanEnergyPct}%</text>
          <text x="60" y="76" text-anchor="middle" font-size="9" fill="var(--text2)" font-family="-apple-system,sans-serif">CLEAN</text>
        </svg><span>Share of electricity from renewables and nuclear</span></div>`;
        const bars = `<div class="energy-bars">` + research.bars.map(b=>`<div class="ebar-row"><span class="ebar-label">${b[0]}</span><div class="ebar-track"><div class="ebar-fill" style="width:${b[1]}%;background:${b[2]}"></div></div><span class="ebar-pct">${b[1]}%</span></div>`).join('') + `</div>`;
        sections += `<p class="section-label">Energy Profile</p><p class="section-text">${research.energyOverview}</p><div class="energy-layout">${radial}${bars}</div>`;
        if(research.energyNote) sections += `<p class="section-text" style="margin-top:1.5rem">${research.energyNote}</p>`;
      } else { sections += researching('Energy Profile'); }

      // Emissions
      if(research){
        const maxScale = Math.max(research.ghgValue, WORLD_AVG_GHG) * 1.25;
        const cPct = (research.ghgValue/maxScale*100).toFixed(0);
        const wPct = (WORLD_AVG_GHG/maxScale*100).toFixed(0);
        sections += `<p class="section-label">Emissions</p><p class="section-text">${research.emissions}</p>
        <div class="compare-bars">
          <div class="cbar-row"><div class="cbar-top"><span>${name}</span><span>${research.ghgValue}t CO2e</span></div><div class="cbar-track"><div class="cbar-fill" style="width:${cPct}%;background:var(--acm)"></div></div></div>
          <div class="cbar-row"><div class="cbar-top"><span>Global Average</span><span>${WORLD_AVG_GHG}t CO2e</span></div><div class="cbar-track"><div class="cbar-fill" style="width:${wPct}%;background:var(--text2);opacity:.5"></div></div></div>
        </div>`;
      } else { sections += researching('Emissions'); }

      // Threats
      if(research){
        sections += `<p class="section-label">Climate Threats</p><div class="threat-grid">` + research.threats.map(t=>`<div class="threat-card">${icon(t[2])}<h4>${t[0]}</h4><p>${t[1]}</p></div>`).join('') + `</div>`;
      } else { sections += researching('Climate Threats'); }

      // Government timeline
      if(research){
        sections += `<p class="section-label">Government & Policy</p><div class="gov-timeline">` + research.government.map(g=>`<div class="gov-item"><div class="gov-dot"></div><div class="gov-year">${g[0]}</div><div class="gov-text">${g[1]}</div></div>`).join('') + `</div>`;
        sections += `<p class="section-text" style="margin-top:1.5rem">See <a href="watch.html" style="color:var(--acm)">The Watch</a> for ongoing US federal actions on energy and climate.</p>`;
      } else { sections += researching('Government & Policy'); }

      // Initiatives
      if(research){
        sections += `<p class="section-label">Initiatives</p>` + research.initiatives.map(i=>{
          let progress = '';
          if(i[2] !== null){
            progress = `<div class="init-progress"><div class="init-progress-top"><span>${i[3]}</span><span>${i[2]}%</span></div><div class="init-progress-track"><div class="init-progress-fill" style="width:${i[2]}%"></div></div></div>`;
          }
          return `<div class="init-block"><div class="init-title">${i[0]}</div><p class="init-text">${i[1]}</p>${progress}</div>`;
        }).join('');
      } else { sections += researching('Initiatives'); }

      // People
      if(research){
        sections += `<p class="section-label">Remarkable People</p><div class="people-grid">` + research.people.map(p=>`<div class="person-card"><div class="avatar">${p[1]}</div><div class="person-info"><h4>${p[0]}</h4><p class="person-role">${p[2]}</p><p>${p[3]}</p></div></div>`).join('') + `</div>`;
      } else { sections += researching('Remarkable People'); }

      // Organizations
      if(research){
        sections += `<p class="section-label">Organizations</p><div class="org-list">` + research.orgs.map(o=>`<div class="org-row">${icon('leaf')}<div class="org-row-text"><a href="${o[1]}" target="_blank">${o[0]}</a><p class="org-desc">${o[2]}</p></div><span class="tag">${o[3]}</span></div>`).join('') + `</div>`;
        sections += `<p class="section-text" style="margin-top:1rem">See <a href="action.html" style="color:var(--acm)">Take Action</a> for more organizations working on clean energy and climate globally.</p>`;
      } else { sections += researching('Organizations'); }

      // Facts
      if(research){
        sections += `<p class="section-label">Did You Know</p><div class="fact-grid">` + research.facts.map(f=>`<div class="fact-card">${icon('spark')}<p>${f}</p></div>`).join('') + `</div>`;
      }

      const sourceNote = research ? `<p class="source-note">Sources: ${research.sources}</p>` : '';

      page.innerHTML = `
        <div class="breadcrumb"><a href="index.html#explore">Explore</a><span>&#8250;</span><span>${name}</span></div>
        <div class="header">
          ${flagImg}
          <h1>${name}</h1>
          <p class="header-overview">${overview}</p>
          <div class="header-stats">${statsHtml}</div>
        </div>
        <div class="country-map-block">
          <div class="map-frame"><div id="countryMap"></div></div>
          <p class="map-caption">${research && research.hasProvinces ? name + '\\'s provinces are shown on the world map below. Hover to see each region\\'s name.' : name + ' highlighted on the world map.'}</p>
        </div>
        <div class="container">
          ${sections}
          ${sourceNote}
          <a href="index.html#explore" class="back-link">&#8592; Back to the Map</a>
        </div>
      `;

      // ── BIG WORLD MAP with this country highlighted ──
      const cm = L.map('countryMap',{zoomControl:true,dragging:true,scrollWheelZoom:false,doubleClickZoom:true,touchZoom:true,attributionControl:false,minZoom:2,maxZoom:9});
      L.tileLayer(isDark?'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(cm);

      // Context layer: all world countries, neutral, non-interactive
      L.geoJson(worldData,{style:function(f){
        const isThis = getCode(f.properties)===id;
        return isThis ? {fillColor:'transparent',fillOpacity:0,color:'transparent',weight:0} :
          {fillColor:isDark?'#3f4654':'#94a3b8',fillOpacity:isDark?.15:.08,color:isDark?'#5b6472':'#94a3b8',weight:.5,opacity:.5};
      },smoothFactor:0.6,interactive:false}).addTo(cm);

      // Highlight layer: just this country
      const hl = L.geoJson(feat,{style:{fillColor:isDark?'#5b9de8':'#2d6ec2',fillOpacity:.32,color:isDark?'#8cc0f5':'#1a4a8a',weight:2.2},interactive:false}).addTo(cm);

      try { cm.fitBounds(hl.getBounds(), {padding:[60,60]}); } catch(e) { cm.setView([20,10],2); }

      // Province overlay — only for countries with hasProvinces flag (currently Vietnam)
      if(research && research.hasProvinces){
        fetch('https://www.geoboundaries.org/api/current/gbOpen/'+id+'/ADM1/')
          .then(r=>r.json())
          .then(meta=>{
            const url = meta.simplifiedGeometryGeoJSON || meta.gjDownloadURL;
            return fetch(url);
          })
          .then(r=>r.json())
          .then(provData=>{
            L.geoJson(provData,{
              style:{fillColor:'transparent',fillOpacity:0,color:isDark?'#cfe3fb':'#1a4a8a',weight:1,opacity:.55},
              onEachFeature:function(f,layer){
                const pname = f.properties.shapeName || f.properties.shapeName_en || 'Region';
                layer.bindTooltip(pname,{className:'province-tooltip',sticky:true,direction:'top'});
                layer.on({
                  mouseover:function(){layer.setStyle({fillColor:isDark?'#5b9de8':'#2d6ec2',fillOpacity:.25,weight:1.8})},
                  mouseout:function(){layer.setStyle({fillColor:'transparent',fillOpacity:0,weight:1})},
                  click:function(){layer.openTooltip()}
                });
              }
            }).addTo(cm);
          })
          .catch(()=>{ /* province overlay optional, fails silently if unavailable */ });
      }
    })
    .catch(()=>{
      page.innerHTML = '<div class="not-found"><h1>Unable to load country data</h1><p>This may work once live on GitHub Pages. Go back to the map and try again.</p><a href="index.html#explore" class="back-link">&#8592; Back to the Map</a></div>';
    });
}
</script>
</body>
</html>
