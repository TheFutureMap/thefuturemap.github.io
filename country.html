<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title id="pageTitle">Country — The Future Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f7f7f5;--text:#1a1a1a;--text2:#6b6b68;--border:rgba(0,0,0,.1);--accent:#1a4a8a;--acl:#e8f0fa;--acm:#2d6ec2}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#1e2028;--text:#f0ede8;--text2:#9a9992;--border:rgba(255,255,255,.1);--accent:#2d6ec2;--acl:#0d1e3a;--acm:#5b9de8}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:16px}
nav{position:sticky;top:0;z-index:200;background:var(--bg);border-bottom:.5px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:15px;font-weight:500;color:var(--text);text-decoration:none;letter-spacing:-.01em}
.nav-logo span{color:var(--acm)}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{font-size:14px;color:var(--text2);text-decoration:none;transition:color .15s}
.nav-links a:hover{color:var(--text)}
.breadcrumb{max-width:1100px;margin:0 auto;padding:1.5rem 2rem 0;display:flex;align-items:center;gap:.5rem;font-size:13px;color:var(--text2)}
.breadcrumb a{color:var(--acm);text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.header{max-width:1100px;margin:0 auto;padding:1.5rem 2rem 2rem;display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap}
.header-main{flex:1;min-width:280px}
.header-flag{width:56px;height:40px;border-radius:6px;object-fit:cover;box-shadow:0 0 0 .5px rgba(0,0,0,.15);margin-bottom:.75rem;background:var(--bg2)}
.header h1{font-size:2rem;font-weight:500;letter-spacing:-.02em;margin-bottom:.75rem}
.header-overview{font-size:15px;color:var(--text2);line-height:1.8;max-width:560px}
.header-stats{display:flex;gap:8px;margin-top:1.25rem;flex-wrap:wrap}
.hstat{background:var(--bg2);border:.5px solid var(--border);border-radius:10px;padding:8px 14px;text-align:center;min-width:90px}
.hstat span{display:block;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.03em;color:var(--text2);opacity:.8;margin-bottom:2px}
.hstat strong{font-size:15px;font-weight:600;color:var(--text)}
.header-map{width:300px;height:280px;border-radius:14px;overflow:hidden;border:.5px solid var(--border);flex-shrink:0;background:var(--bg2)}
#countryMap{width:100%;height:100%}
.leaflet-control-attribution{display:none!important}
.container{max-width:1100px;margin:0 auto;padding:0 2rem 5rem}
.section-label{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--acm);margin:3rem 0 1rem;padding-top:2rem;border-top:.5px solid var(--border)}
.section-label:first-of-type{border-top:none;margin-top:0;padding-top:0}
.section-text{font-size:14.5px;color:var(--text2);line-height:1.85;max-width:760px}
.section-text+.section-text{margin-top:1rem}
.energy-bars{display:flex;flex-direction:column;gap:8px;margin-top:1.25rem;max-width:500px}
.ebar-row{display:flex;align-items:center;gap:10px}
.ebar-label{font-size:12.5px;color:var(--text2);width:90px;flex-shrink:0}
.ebar-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.ebar-fill{height:100%;background:var(--acm);border-radius:4px}
.ebar-pct{font-size:12px;font-weight:500;color:var(--text);width:36px;text-align:right;flex-shrink:0}
.threat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--border);border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin-top:1.25rem}
.threat-card{background:var(--bg);padding:1.25rem 1.5rem}
.threat-card h4{font-size:13.5px;font-weight:500;margin-bottom:.4rem;color:var(--text)}
.threat-card p{font-size:13px;color:var(--text2);line-height:1.6}
.people-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--border);border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin-top:1.25rem}
.person-card{background:var(--bg);padding:1.5rem}
.person-card h4{font-size:14.5px;font-weight:500;color:var(--text);margin-bottom:.3rem}
.person-role{font-size:11.5px;color:var(--acm);font-weight:500;margin-bottom:.6rem}
.person-card p{font-size:13px;color:var(--text2);line-height:1.65}
.org-list{display:flex;flex-direction:column;gap:0;margin-top:1.25rem}
.org-row{display:flex;justify-content:space-between;align-items:center;padding:.875rem 0;border-bottom:.5px solid var(--border)}
.org-row:first-child{border-top:.5px solid var(--border)}
.org-row a{font-size:14px;font-weight:500;color:var(--text);text-decoration:none}
.org-row a:hover{color:var(--acm)}
.org-desc{font-size:12.5px;color:var(--text2);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:500;color:var(--acm);background:var(--acl);padding:4px 12px;border-radius:100px}
.fact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1.25rem}
.fact-card{background:var(--bg2);border-radius:12px;padding:1.25rem 1.5rem}
.fact-card p{font-size:13.5px;color:var(--text);line-height:1.65}
.source-note{font-size:11.5px;color:var(--text2);opacity:.7;margin-top:2.5rem;padding-top:1.5rem;border-top:.5px solid var(--border)}
.back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:14px;color:var(--acm);text-decoration:none;margin-top:2.5rem}
.back-link:hover{text-decoration:underline}
.researching{background:var(--bg2);border-radius:12px;padding:1.5rem 1.75rem;margin-top:1.25rem}
.researching p{font-size:13.5px;color:var(--text2);font-style:italic;line-height:1.7}
.not-found{max-width:1100px;margin:4rem auto;padding:0 2rem;text-align:center}
.not-found h1{font-size:1.5rem;font-weight:500;margin-bottom:.75rem}
.not-found p{color:var(--text2);font-size:14.5px}
footer{border-top:.5px solid var(--border);padding:2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;max-width:1100px;margin:0 auto}
footer p{font-size:13px;color:var(--text2)}
.footer-links{display:flex;gap:1.5rem;list-style:none}
.footer-links a{font-size:13px;color:var(--text2);text-decoration:none}
@media(max-width:700px){.header{flex-direction:column}.header-map{width:100%}nav{padding:0 1rem}.nav-links{gap:1rem}.container{padding:0 1.25rem 3rem}.breadcrumb{padding:1.5rem 1.25rem 0}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">The <span>Future</span> Map</a>
  <ul class="nav-links">
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html">Explore</a></li>
    <li><a href="frontier.html">The Frontier</a></li>
    <li><a href="watch.html">The Watch</a></li>
    <li><a href="action.html">Take Action</a></li>
  </ul>
</nav>

<div id="page"></div>

<footer>
  <p>&#169; 2026 The Future Map.</p>
  <ul class="footer-links"><li><a href="index.html#about">About</a></li><li><a href="https://instagram.com/the_future_map" target="_blank">Instagram</a></li></ul>
</footer>

<script>
// ── BASIC STATS for the currently featured countries on the map ──
// (population, clean energy share, GHG/capita). Matches index.html.
const STATS = {
'USA':{name:'United States',iso2:'us',population:'335M',cleanEnergy:'39%',ghg:'18.0t'},
'FRA':{name:'France',iso2:'fr',population:'68M',cleanEnergy:'93%',ghg:'6.4t'},
'DEU':{name:'Germany',iso2:'de',population:'84M',cleanEnergy:'47%',ghg:'10.4t'},
'NOR':{name:'Norway',iso2:'no',population:'5.5M',cleanEnergy:'98%',ghg:'9.0t'},
'IND':{name:'India',iso2:'in',population:'1.45B',cleanEnergy:'22%',ghg:'2.7t'},
'CHN':{name:'China',iso2:'cn',population:'1.41B',cleanEnergy:'35%',ghg:'11.0t'},
'KHM':{name:'Cambodia',iso2:'kh',population:'17M',cleanEnergy:'35%',ghg:'3.0t'},
'SGP':{name:'Singapore',iso2:'sg',population:'6M',cleanEnergy:'3%',ghg:'9.0t'},
'VNM':{name:'Vietnam',iso2:'vn',population:'98M',cleanEnergy:'44%',ghg:'3.8t'},
'CAN':{name:'Canada',iso2:'ca',population:'41M',cleanEnergy:'82%',ghg:'18.0t'},
'CHE':{name:'Switzerland',iso2:'ch',population:'9M',cleanEnergy:'94%',ghg:'5.0t'},
'GBR':{name:'United Kingdom',iso2:'gb',population:'68M',cleanEnergy:'60%',ghg:'6.5t'},
'KOR':{name:'South Korea',iso2:'kr',population:'52M',cleanEnergy:'39%',ghg:'13.0t'},
'JPN':{name:'Japan',iso2:'jp',population:'123M',cleanEnergy:'32%',ghg:'9.5t'},
'AUS':{name:'Australia',iso2:'au',population:'27M',cleanEnergy:'39%',ghg:'16.0t'},
'BRA':{name:'Brazil',iso2:'br',population:'216M',cleanEnergy:'89%',ghg:'6.5t'},
'ITA':{name:'Italy',iso2:'it',population:'59M',cleanEnergy:'41%',ghg:'6.5t'},
'ESP':{name:'Spain',iso2:'es',population:'48M',cleanEnergy:'71%',ghg:'6.0t'},
'SWE':{name:'Sweden',iso2:'se',population:'10.5M',cleanEnergy:'99%',ghg:'5.0t'},
'MEX':{name:'Mexico',iso2:'mx',population:'130M',cleanEnergy:'28%',ghg:'4.5t'},
'ARG':{name:'Argentina',iso2:'ar',population:'46M',cleanEnergy:'42%',ghg:'7.5t'},
'PRT':{name:'Portugal',iso2:'pt',population:'10.3M',cleanEnergy:'65%',ghg:'5.5t'},
'FIN':{name:'Finland',iso2:'fi',population:'5.5M',cleanEnergy:'80%',ghg:'7.0t'},
'NLD':{name:'Netherlands',iso2:'nl',population:'17.5M',cleanEnergy:'43%',ghg:'9.0t'},
'DNK':{name:'Denmark',iso2:'dk',population:'5.9M',cleanEnergy:'87%',ghg:'7.0t'},
'BEL':{name:'Belgium',iso2:'be',population:'11.6M',cleanEnergy:'72%',ghg:'9.0t'},
'ISL':{name:'Iceland',iso2:'is',population:'380K',cleanEnergy:'99%',ghg:'7.5t'},
'TWN':{name:'Taiwan',iso2:'tw',population:'23.5M',cleanEnergy:'18%',ghg:'11.5t'},
'GRC':{name:'Greece',iso2:'gr',population:'10.5M',cleanEnergy:'50%',ghg:'7.0t'},
'RUS':{name:'Russia',iso2:'ru',population:'145M',cleanEnergy:'40%',ghg:'16.0t'},
'NZL':{name:'New Zealand',iso2:'nz',population:'5.1M',cleanEnergy:'85%',ghg:'8.0t'},
'POL':{name:'Poland',iso2:'pl',population:'38M',cleanEnergy:'26%',ghg:'12.0t'},
'EGY':{name:'Egypt',iso2:'eg',population:'105M',cleanEnergy:'14%',ghg:'3.5t'},
'TUR':{name:'Turkey',iso2:'tr',population:'85M',cleanEnergy:'43%',ghg:'7.0t'},
'AUT':{name:'Austria',iso2:'at',population:'9M',cleanEnergy:'80%',ghg:'8.0t'}
};

// ── DEEP RESEARCH content, added one country at a time ──
// Each entry: netZero, energy (overview + bars[]), emissions, threats[],
// government, initiatives, people[], orgs[], facts[], sources
const RESEARCH = {
'VNM': {
  netZero: '2050',
  overview: 'Vietnam has experienced one of the fastest clean energy transitions in Southeast Asia, dramatically expanding solar capacity in just a few years. The country faces significant climate vulnerability, particularly in the densely populated Mekong Delta, while pursuing an ambitious net-zero target backed by international financing.',
  energyOverview: 'Vietnam\'s electricity mix has shifted dramatically over the past decade. Solar capacity grew from essentially zero in 2015 to 16.6 GW by 2020, driven by strong feed-in tariffs that made Vietnam one of the fastest-growing solar markets in the world. Coal still plays a significant role in meeting rising demand, and the revised Power Development Plan 8 (PDP8) controversially reintroduces nuclear power as a future baseload option.',
  energyNote: 'Vietnam\'s long coastline gives it offshore wind potential of up to 500 GW, comparable in scale to the baseload currently provided by coal. Realizing this potential will require significant investment, since existing wind capacity stands at slightly below 4 GW today.',
  bars: [['Coal',40,'#8a6200'],['Hydropower',28,'#2d6ec2'],['Solar',12,'#e8a33d'],['Natural Gas',10,'#9a7ab8'],['Wind',4,'#4db8a8'],['Other',6,'#94a3b8']],
  emissions: 'Vietnam\'s CO2 emissions sit at roughly 2.6 tonnes per capita, with total greenhouse gas emissions including methane and land-use change reaching approximately 3.8 tonnes CO2e per capita. While still well below the global average for industrialized economies, emissions are rising quickly alongside rapid industrialization and growing energy demand, which PDP8 projects could grow 12-13% as the economy targets 10% annual GDP growth between 2026 and 2030.',
  threats: [
    ['Mekong Delta Vulnerability','Sea level rise and saltwater intrusion threaten agriculture across the Mekong Delta, home to tens of millions of people and a critical rice-growing region for the entire country.'],
    ['Severe Typhoons','Increasingly severe typhoons along the central and northern coasts cause widespread flooding, landslides, and infrastructure damage each year.'],
    ['Economic Cost','Climate-related disasters already cost Vietnam an estimated 1 to 1.5 percent of GDP annually, with adaptation costs projected to reach 3 to 5 percent of GDP by 2030.'],
    ['Civil Society Restrictions','Independent environmental NGOs and activists face significant restrictions, limiting the space for grassroots climate advocacy and oversight.']
  ],
  government: ['At COP26 in 2021, Prime Minister Pham Minh Chinh announced Vietnam\'s commitment to reach net-zero emissions by 2050, combining domestic resources with international support. Vietnam also signed the Global Coal to Clean Power Transition statement, pledging to phase out coal-fired power by the 2040s, and joined the Global Methane Pledge.',
    'In June 2025, Vietnam launched a pilot emissions trading scheme covering the power, cement, and steel sectors, together responsible for nearly half of national emissions. A fully operational carbon market is expected by 2028. The revised PDP8 underpins national energy planning through 2030, though its assumption of 10% annual GDP growth has driven policy choices that extend coal capacity through the 2030s and revive nuclear power for baseload supply.'],
  initiatives: [
    ['Just Energy Transition Partnership (JETP)','A landmark partnership signed in 2022 mobilizing $15.5 billion in public and private finance for 2026-2028 to help Vietnam shift away from coal while supporting affected communities and industries. Of the pledged total, 24 projects are underway with $7 billion already mobilized, with the most tangible progress in hydropower deployment and transmission upgrades. The United States withdrew from the International Partner Group in 2025, narrowing the financing pool, though other international partners have moved to backfill the gap.'],
    ['Offshore Wind Development','With up to 500 GW of technical potential along its coastline, Vietnam is working to scale offshore wind from its current base of under 4 GW into a major pillar of its clean energy future.'],
    ['EV Incentives','Tax incentives for electric vehicle buyers have been put in place to accelerate the adoption of zero-emission transportation.']
  ],
  people: [
    ['Nguy Thi Khanh','Founder, GreenID','The first Vietnamese person to win the Goldman Environmental Prize (2018) and a 2024 Climate Breakthrough Award recipient. Khanh has spent her career building coalitions of scientists, experts, media, and civil society to shift Vietnam\'s power sector away from coal and toward clean energy and efficiency, working as one of few prominent women leaders in the country\'s energy space.'],
    ['Pham Minh Chinh','Prime Minister of Vietnam','Announced Vietnam\'s landmark commitment to reach net-zero emissions by 2050 at COP26 in Glasgow, setting the policy direction that underpins the country\'s current energy transition and international climate financing partnerships.']
  ],
  orgs: [
    ['GreenID (Green Innovation and Development Centre)','https://greenidvietnam.org.vn','Vietnamese NGO advancing clean energy policy and reducing reliance on coal, founded by Nguy Thi Khanh.','Local'],
    ['Global Energy Alliance for People and Planet','https://energyalliance.org/vietnam','Mobilizes technical assistance and financing to accelerate Vietnam\'s clean energy leapfrog.','International']
  ],
  facts: [
    'Vietnam\'s solar capacity went from zero to 16.6 GW in just five years, one of the fastest renewable buildouts ever recorded anywhere in the world.',
    'Vietnam\'s potential offshore wind capacity, 500 GW, is large enough to theoretically replace the role coal currently plays in the country\'s electricity grid.',
    'Vietnam celebrated 80 years of independence in 2025, the same year it launched its first pilot carbon market.'
  ],
  sources: 'Climate Action Tracker, UNDP Vietnam, Asia Society Policy Institute, Climate Breakthrough Award, Global Energy Alliance for People and Planet. Figures current as of early 2026 and updated periodically. Energy mix percentages are approximate based on available reporting.'
}
};

function getCode(p){let c=p.ISO_A3;if(!c||c==='-99')c=p.ADM0_A3;if(!c||c==='-99')c=p.ISO_A3_EH;return c}
function getName(p){let n=p.ADMIN||p.NAME_LONG||p.NAME_EN||p.NAME||p.name;if(!n||(n.length<=3&&n===n.toUpperCase()))n=p.NAME_LONG||p.SOVEREIGNT||'Unknown region';return n}
function getIso2(p){let i=p.ISO_A2||p.ISO_A2_EH;if(!i||i==='-99'||i.length!==2)return null;return i.toLowerCase()}

const params = new URLSearchParams(window.location.search);
const id = (params.get('id')||'').toUpperCase();
const page = document.getElementById('page');
const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;

if(!id){
  page.innerHTML = '<div class="not-found"><h1>No country specified</h1><p>Go back to the map and click a country to explore it.</p><a href="index.html" class="back-link">&#8592; Back to the Map</a></div>';
} else {
  fetch('https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/50m/cultural/ne_50m_admin_0_countries.json')
    .then(r=>r.json())
    .then(data=>{
      const feat = data.features.find(f => getCode(f.properties) === id);
      if(!feat){
        page.innerHTML = '<div class="not-found"><h1>Country not found</h1><p>We couldn\'t find that country. Go back to the map and try again.</p><a href="index.html" class="back-link">&#8592; Back to the Map</a></div>';
        return;
      }
      const stat = STATS[id];
      const research = RESEARCH[id];
      const name = stat ? stat.name : getName(feat.properties);
      const iso2 = stat ? stat.iso2 : getIso2(feat.properties);
      document.title = name + ' — The Future Map';
      document.getElementById('pageTitle').textContent = name + ' — The Future Map';

      const flagImg = iso2 ? `<img class="header-flag" src="https://flagcdn.com/w160/${iso2}.png" alt="${name} flag"/>` : '';
      const overview = research ? research.overview : (stat ? 'A deeper profile of ' + name + ' is being researched and will be added as The Future Map grows.' : name + ' is part of The Future Map\'s ongoing coverage. Detailed information is being researched and will be added soon.');

      const statsHtml = stat ? `
        <div class="hstat"><span>Population</span><strong>${stat.population}</strong></div>
        <div class="hstat"><span>Clean Energy Share</span><strong>${stat.cleanEnergy}</strong></div>
        <div class="hstat"><span>GHG / Capita (CO2e)</span><strong>${stat.ghg}</strong></div>
        ${research ? `<div class="hstat"><span>Net-Zero Target</span><strong>${research.netZero}</strong></div>` : ''}
      ` : `<div class="hstat"><span>Status</span><strong>Researching</strong></div>`;

      function researching(label){
        return `<p class="section-label">${label}</p><div class="researching"><p>This section for ${name} is still being researched and will be added as The Future Map grows.</p></div>`;
      }

      let sections = '';

      // Energy
      if(research){
        sections += `<p class="section-label">Energy Profile</p><p class="section-text">${research.energyOverview}</p>`;
        sections += `<div class="energy-bars">` + research.bars.map(b=>`<div class="ebar-row"><span class="ebar-label">${b[0]}</span><div class="ebar-track"><div class="ebar-fill" style="width:${b[1]}%;background:${b[2]}"></div></div><span class="ebar-pct">${b[1]}%</span></div>`).join('') + `</div>`;
        if(research.energyNote) sections += `<p class="section-text" style="margin-top:1.5rem">${research.energyNote}</p>`;
      } else { sections += researching('Energy Profile'); }

      // Emissions
      sections += research ? `<p class="section-label">Emissions</p><p class="section-text">${research.emissions}</p>` : researching('Emissions');

      // Threats
      if(research){
        sections += `<p class="section-label">Climate Threats</p><div class="threat-grid">` + research.threats.map(t=>`<div class="threat-card"><h4>${t[0]}</h4><p>${t[1]}</p></div>`).join('') + `</div>`;
      } else { sections += researching('Climate Threats'); }

      // Government
      if(research){
        sections += `<p class="section-label">Government & Policy</p>` + research.government.map(g=>`<p class="section-text">${g}</p>`).join('');
        sections += `<p class="section-text">See <a href="watch.html" style="color:var(--acm)">The Watch</a> for ongoing US federal actions on energy and climate.</p>`;
      } else { sections += researching('Government & Policy'); }

      // Initiatives
      if(research){
        sections += `<p class="section-label">Initiatives</p>` + research.initiatives.map(i=>`<p class="section-text"><strong style="color:var(--text);font-weight:500">${i[0]}</strong> — ${i[1]}</p>`).join('');
      } else { sections += researching('Initiatives'); }

      // People
      if(research){
        sections += `<p class="section-label">Remarkable People</p><div class="people-grid">` + research.people.map(p=>`<div class="person-card"><h4>${p[0]}</h4><p class="person-role">${p[1]}</p><p>${p[2]}</p></div>`).join('') + `</div>`;
      } else { sections += researching('Remarkable People'); }

      // Organizations
      if(research){
        sections += `<p class="section-label">Organizations</p><div class="org-list">` + research.orgs.map(o=>`<div class="org-row"><div><a href="${o[1]}" target="_blank">${o[0]}</a><p class="org-desc">${o[2]}</p></div><span class="tag">${o[3]}</span></div>`).join('') + `</div>`;
        sections += `<p class="section-text" style="margin-top:1rem">See <a href="action.html" style="color:var(--acm)">Take Action</a> for more organizations working on clean energy and climate globally.</p>`;
      } else { sections += researching('Organizations'); }

      // Facts
      if(research){
        sections += `<p class="section-label">Did You Know</p><div class="fact-grid">` + research.facts.map(f=>`<div class="fact-card"><p>${f}</p></div>`).join('') + `</div>`;
      }

      const sourceNote = research ? `<p class="source-note">Sources: ${research.sources}</p>` : '';

      page.innerHTML = `
        <div class="breadcrumb"><a href="index.html">Explore</a><span>&#8250;</span><span>${name}</span></div>
        <div class="header">
          <div class="header-main">
            ${flagImg}
            <h1>${name}</h1>
            <p class="header-overview">${overview}</p>
            <div class="header-stats">${statsHtml}</div>
          </div>
          <div class="header-map"><div id="countryMap"></div></div>
        </div>
        <div class="container">
          ${sections}
          ${sourceNote}
          <a href="index.html" class="back-link">&#8592; Back to the Map</a>
        </div>
      `;

      // Mini map
      const cm = L.map('countryMap',{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,attributionControl:false});
      L.tileLayer(isDark?'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(cm);
      const layer = L.geoJson(feat, {style:{fillColor:isDark?'#5b9de8':'#2d6ec2',fillOpacity:.35,color:isDark?'#8cc0f5':'#1a4a8a',weight:2}}).addTo(cm);
      try { cm.fitBounds(layer.getBounds(), {padding:[10,10]}); } catch(e) { cm.setView([20,10],2); }
    })
    .catch(()=>{
      page.innerHTML = '<div class="not-found"><h1>Unable to load country data</h1><p>This may work once live on GitHub Pages. Go back to the map and try again.</p><a href="index.html" class="back-link">&#8592; Back to the Map</a></div>';
    });
}
</script>
</body>
</html>
