<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title id="pageTitle">Country — The Future Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f7f7f5;--text:#1a1a1a;--text2:#6b6b68;--border:rgba(0,0,0,.1);--accent:#1a4a8a;--acl:#e8f0fa;--acm:#2d6ec2}
@media (min-width: 1px){:root{--bg:#1a1a1a;--bg2:#1e2028;--text:#f0ede8;--text2:#9a9992;--border:rgba(255,255,255,.1);--accent:#2d6ec2;--acl:#0d1e3a;--acm:#5b9de8}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:16px}
nav{position:sticky;top:0;z-index:500;background:var(--bg);border-bottom:.5px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:15px;font-weight:500;color:var(--text);text-decoration:none;letter-spacing:-.01em}
.nav-logo span{color:var(--acm)}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{font-size:14px;color:var(--text2);text-decoration:none;transition:color .15s}
.nav-links a:hover{color:var(--text)}
.breadcrumb{max-width:1100px;margin:0 auto;padding:1.25rem 2rem 0;display:flex;align-items:center;gap:.5rem;font-size:13px;color:var(--text2)}
.breadcrumb a{color:var(--acm);text-decoration:none}.breadcrumb a:hover{text-decoration:underline}
/* Two-column header: text left, square map right */
.header{max-width:1100px;margin:0 auto;padding:1.25rem 2rem 2rem;display:flex;gap:2rem;align-items:flex-start}
.header-main{flex:1;min-width:0}
.header-flag{width:56px;height:40px;border-radius:5px;object-fit:cover;box-shadow:0 0 0 .5px rgba(0,0,0,.15);margin-bottom:.75rem;background:var(--bg2)}
.header h1{font-size:2rem;font-weight:500;letter-spacing:-.02em;margin-bottom:.75rem}
.header-overview{font-size:14.5px;color:var(--text2);line-height:1.8;max-width:560px}
.header-stats{display:flex;gap:8px;margin-top:1.25rem;flex-wrap:wrap}
.hstat{background:var(--bg2);border:.5px solid var(--border);border-radius:10px;padding:8px 14px;text-align:center;min-width:88px}
.hstat span{display:block;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.03em;color:var(--text2);opacity:.8;margin-bottom:2px}
.hstat strong{font-size:15px;font-weight:600;color:var(--text)}
/* Square map — fixed size, right side, isolated so Leaflet never pops over nav */
.header-map-wrap{flex-shrink:0;width:340px}
.header-map{isolation:isolate;z-index:0;width:340px;height:340px;border-radius:14px;overflow:hidden;border:.5px solid var(--border);background:var(--bg2)}
#countryMap{width:100%;height:100%}
.map-caption{font-size:11.5px;color:var(--text2);margin-top:.5rem;opacity:.75;text-align:center}
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom a{background:var(--bg)!important;color:var(--text)!important;border-color:var(--border)!important}
.province-tooltip{background:var(--bg)!important;color:var(--text)!important;border:.5px solid var(--acm)!important;border-radius:6px!important;font-family:inherit!important;font-size:12px!important;font-weight:500!important;padding:4px 9px!important;box-shadow:0 2px 8px rgba(0,0,0,.12)!important}
.province-tooltip::before{display:none!important}
/* Container */
.container{max-width:1100px;margin:0 auto;padding:0 2rem 5rem}
.section-label{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--acm);margin:2.75rem 0 1rem;padding-top:2rem;border-top:.5px solid var(--border)}
.section-label:first-of-type{border-top:none;margin-top:0;padding-top:0}
.section-text{font-size:14.5px;color:var(--text2);line-height:1.85;max-width:760px}
.section-text+.section-text{margin-top:.875rem}
/* Energy */
.energy-layout{display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap;margin-top:1.25rem}
.radial-wrap{text-align:center;flex-shrink:0}
.radial-wrap span{display:block;font-size:11px;color:var(--text2);margin-top:.4rem;max-width:120px}
.energy-bars{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.ebar-row{display:flex;align-items:center;gap:10px}
.ebar-label{font-size:12.5px;color:var(--text2);width:90px;flex-shrink:0}
.ebar-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.ebar-fill{height:100%;border-radius:4px}
.ebar-pct{font-size:12px;font-weight:500;color:var(--text);width:32px;text-align:right;flex-shrink:0}
/* Emissions */
.emissions-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.25rem}
.em-stat-card{background:var(--bg2);border-radius:12px;padding:1.25rem 1.5rem}
.em-stat-number{font-size:2rem;font-weight:600;color:var(--acm);letter-spacing:-.03em;line-height:1}
.em-stat-unit{font-size:12px;color:var(--text2);margin-top:.25rem}
.em-stat-label{font-size:12px;color:var(--text2);margin-top:.4rem;line-height:1.4}
.em-compare{background:var(--bg2);border-radius:12px;padding:1.25rem 1.5rem;grid-column:span 2}
.em-compare h4{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:1rem}
.cbar-row{display:flex;flex-direction:column;gap:3px;margin-bottom:.75rem}
.cbar-row:last-child{margin-bottom:0}
.cbar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.cbar-top span:first-child{color:var(--text2)}
.cbar-top strong{font-weight:600;color:var(--text)}
.cbar-track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.cbar-fill{height:100%;border-radius:5px}
.em-sector{margin-top:.875rem}
.em-sector h4{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:.75rem}
.sector-bars{display:flex;flex-direction:column;gap:6px}
.sector-row{display:flex;align-items:center;gap:8px}
.sector-label{font-size:12px;color:var(--text2);width:100px;flex-shrink:0}
.sector-track{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.sector-fill{height:100%;border-radius:3px}
.sector-pct{font-size:11px;font-weight:500;color:var(--text);width:32px;text-align:right}
/* Threats */
.threat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:1.25rem}
.threat-card{background:var(--bg2);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.threat-body{padding:1rem 1.25rem 1.25rem}
.threat-stat{font-size:1.5rem;font-weight:700;color:var(--acm);letter-spacing:-.02em;line-height:1;margin-bottom:.25rem}
.threat-body h4{font-size:13.5px;font-weight:500;color:var(--text);margin-bottom:.4rem}
.threat-body p{font-size:12.5px;color:var(--text2);line-height:1.6}
/* Government timeline */
.gov-timeline{position:relative;margin-top:1.5rem;padding-left:1.75rem;max-width:680px}
.gov-timeline::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--border);border-radius:2px}
.gov-item{position:relative;padding-bottom:1.5rem}
.gov-item:last-child{padding-bottom:0}
.gov-dot{position:absolute;left:-1.75rem;top:5px;width:12px;height:12px;border-radius:50%;background:var(--acm);border:2.5px solid var(--bg)}
.gov-year{font-size:11px;font-weight:700;color:var(--acm);letter-spacing:.06em;margin-bottom:.2rem}
.gov-title{font-size:13.5px;font-weight:500;color:var(--text);margin-bottom:.2rem}
.gov-text{font-size:13px;color:var(--text2);line-height:1.65}
/* Initiatives */
.init-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-top:1.25rem}
.init-card{background:var(--bg2);border-radius:14px;padding:1.5rem;display:flex;flex-direction:column;gap:.75rem}
.init-card-top{display:flex;align-items:center;gap:.875rem}
.init-icon{width:40px;height:40px;border-radius:10px;background:var(--acm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.init-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.init-card-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
.init-card-text{font-size:13px;color:var(--text2);line-height:1.7;flex:1}
.init-numbers{display:flex;gap:.75rem;flex-wrap:wrap}
.init-num{background:var(--bg);border:.5px solid var(--border);border-radius:8px;padding:6px 12px;text-align:center}
.init-num strong{display:block;font-size:15px;font-weight:700;color:var(--acm)}
.init-num span{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em}
.init-progress{margin-top:.25rem}
.init-progress-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text2);margin-bottom:4px}
.init-progress-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.init-progress-fill{height:100%;background:var(--acm);border-radius:3px}
/* People */
.people-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-top:1.25rem}
.person-card{background:var(--bg2);border-radius:14px;overflow:hidden}
.person-img-wrap{width:100%;height:90px;position:relative;overflow:hidden;background:var(--acl)}
.person-img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.person-avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--acm);font-size:2.25rem;font-weight:700;color:#fff;letter-spacing:.05em}
.person-body{padding:1.125rem 1.25rem 1.25rem}
.person-body h4{font-size:14.5px;font-weight:500;color:var(--text);margin-bottom:.2rem}
.person-role{font-size:11.5px;color:var(--acm);font-weight:500;margin-bottom:.5rem}
.person-body p{font-size:13px;color:var(--text2);line-height:1.65}
/* Orgs */
.org-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-top:1.25rem}
.org-card{background:var(--bg2);border-radius:14px;padding:1.25rem;display:flex;gap:.875rem;align-items:flex-start}
.org-logo-wrap{width:44px;height:44px;border-radius:10px;background:var(--bg);border:.5px solid var(--border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.org-logo{width:36px;height:36px;object-fit:contain}
.org-info{flex:1;min-width:0}
.org-info a{font-size:14px;font-weight:500;color:var(--text);text-decoration:none;line-height:1.35;display:block}
.org-info a:hover{color:var(--acm)}
.org-info p{font-size:12.5px;color:var(--text2);margin-top:.3rem;line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:500;color:var(--acm);background:var(--acl);padding:3px 10px;border-radius:100px;margin-top:.5rem}
/* Did You Know */
.fact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:1.25rem}
.fact-card{background:var(--bg2);border-radius:14px;padding:1.5rem;position:relative;overflow:hidden}
.fact-num{font-size:3rem;font-weight:800;color:var(--acm);letter-spacing:-.04em;line-height:1;margin-bottom:.5rem;opacity:.9}
.fact-card p{font-size:13.5px;color:var(--text);line-height:1.65;position:relative;z-index:1}
/* Shared */
.source-note{font-size:11.5px;color:var(--text2);opacity:.65;margin-top:2.5rem;padding-top:1.5rem;border-top:.5px solid var(--border)}
.back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:14px;color:var(--acm);text-decoration:none;margin-top:2.5rem}
.back-link:hover{text-decoration:underline}
.researching{background:var(--bg2);border-radius:12px;padding:1.5rem 1.75rem;margin-top:1.25rem}
.researching p{font-size:13.5px;color:var(--text2);font-style:italic;line-height:1.7}
.not-found{max-width:800px;margin:4rem auto;padding:0 2rem;text-align:center}
.not-found h1{font-size:1.5rem;font-weight:500;margin-bottom:.75rem}
.not-found p{color:var(--text2);font-size:14.5px}
footer{border-top:.5px solid var(--border);padding:2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;max-width:1100px;margin:0 auto}
footer p{font-size:13px;color:var(--text2)}
.footer-links{display:flex;gap:1.5rem;list-style:none}
.footer-links a{font-size:13px;color:var(--text2);text-decoration:none}
@media(max-width:800px){.header{flex-direction:column-reverse}.header-map-wrap{width:100%}.header-map{width:100%;height:280px}nav{padding:0 1rem}.nav-links{gap:1rem}.container{padding:0 1.25rem 3rem}.breadcrumb{padding:1.25rem 1.25rem 0}.header{padding:1.25rem 1.25rem 1.5rem}.emissions-grid{grid-template-columns:1fr}.em-compare{grid-column:span 1}.threat-grid{grid-template-columns:1fr}}
</style>
</head>

  orgs:[
    {name:'GreenID',fullName:'Green Innovation and Development Centre',url:'https://greenidvietnam.org.vn',desc:'Vietnamese NGO advancing clean energy policy and reducing reliance on coal, founded by Nguy Thi Khanh.',scale:'Local',domain:'greenidvietnam.org.vn'},
    {name:'Global Energy Alliance',fullName:'Global Energy Alliance for People and Planet',url:'https://energyalliance.org',desc:'Mobilizes technical assistance and financing to accelerate clean energy transitions in emerging economies.',scale:'International',domain:'energyalliance.org'}
  ],
  facts:[
    {num:'0 to 16.6',unit:'GW solar in 5 years',text:'Vietnam added 16.6 GW of solar capacity in just five years, one of the fastest renewable buildouts ever recorded in the world.',icon:'☀️'},
    {num:'500',unit:'GW offshore wind potential',text:'Vietnam\'s offshore wind potential is large enough to theoretically replace the entire baseload currently provided by coal.',icon:'💨'},
    {num:'80',unit:'years of independence in 2025',text:'Vietnam celebrated 80 years of independence in 2025, the same year it launched its first pilot carbon market.',icon:'🌿'}
  ],
  sources:'Climate Action Tracker, UNDP Vietnam, Asia Society Policy Institute, Climate Breakthrough Award, Global Energy Alliance for People and Planet, Natural Earth (province boundaries). Figures current as of early 2026 and updated periodically.'
}
};

const WORLD_AVG=6.6;

function getCode(p){let c=p.ISO_A3;if(!c||c==='-99')c=p.ADM0_A3;if(!c||c==='-99')c=p.ISO_A3_EH;return c}
function getName(p){let n=p.ADMIN||p.NAME_LONG||p.NAME_EN||p.NAME||p.name;if(!n||(n.length<=3&&n===n.toUpperCase()))n=p.NAME_LONG||p.SOVEREIGNT||'Unknown';return n}
function getIso2(p){let i=p.ISO_A2||p.ISO_A2_EH;if(!i||i==='-99'||i.length!==2)return null;return i.toLowerCase()}

const ICON_SVGS={
  bolt:'<svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
  wind:'<svg viewBox="0 0 24 24"><path d="M4 8h10a3 3 0 1 0-3-3"/><path d="M2 13h13a3 3 0 1 1-3 3"/><path d="M4 18h7"/></svg>',
  car:'<svg viewBox="0 0 24 24"><rect x="2" y="11" width="20" height="8" rx="2"/><path d="M5 11V9a7 7 0 0 1 14 0v2"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg>'
};

function svgIcon(key,color){
  const s=ICON_SVGS[key]||ICON_SVGS.bolt;
  return s.replace('<svg ','<svg width="20" height="20" fill="none" stroke="'+(color||'#fff')+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ');
}

const params=new URLSearchParams(window.location.search);
const id=(params.get('id')||'').toUpperCase();
const page=document.getElementById('page');
const isDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;

if(!id){
  page.innerHTML='<div class="not-found"><h1>No country specified</h1><p>Go back to the map and click a country.</p><a href="index.html#explore" class="back-link">&#8592; Back to the Map</a></div>';
}else{
  fetch('https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/50m/cultural/ne_50m_admin_0_countries.json')
  .then(r=>r.json())
  .then(worldData=>{
    const feat=worldData.features.find(f=>getCode(f.properties)===id);
    if(!feat){page.innerHTML='<div class="not-found"><h1>Country not found</h1><p><a href="index.html#explore" class="back-link">&#8592; Back to the Map</a></p></div>';return;}
    const stat=STATS[id];
    const R=RESEARCH[id];
    const name=stat?stat.name:getName(feat.properties);
    const iso2=stat?stat.iso2:getIso2(feat.properties);
    document.title=name+' — The Future Map';
    document.getElementById('pageTitle').textContent=name+' — The Future Map';

    const flagHtml=iso2?`<img class="header-flag" src="https://flagcdn.com/w160/${iso2}.png" alt="${name} flag"/>`:'';
    const overview=R?R.overview:(stat?'A deeper profile of '+name+' is being researched and will be added as The Future Map grows.':name+' is part of The Future Map\'s ongoing coverage. Detailed information is coming soon.');
    const statsHtml=stat?`<div class="hstat"><span>Population</span><strong>${stat.population}</strong></div><div class="hstat"><span>Clean Energy Share</span><strong>${stat.cleanEnergy}</strong></div><div class="hstat"><span>GHG / Capita</span><strong>${stat.ghg} CO2e</strong></div>${R?`<div class="hstat"><span>Net-Zero Target</span><strong>${R.netZero}</strong></div>`:''}`:'<div class="hstat"><span>Status</span><strong>Researching</strong></div>';

    function notYet(label){return`<p class="section-label">${label}</p><div class="researching"><p>This section for ${name} is still being researched and will be added as The Future Map grows.</p></div>`;}

    let s='';

    // Energy
    if(R){
      const r=50,circ=2*Math.PI*r,offset=circ*(1-R.cleanEnergyPct/100);
      const radial=`<div class="radial-wrap"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--bg2)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--acm)" stroke-width="10" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 60 60)"/><text x="60" y="57" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text)" font-family="-apple-system,sans-serif">${R.cleanEnergyPct}%</text><text x="60" y="73" text-anchor="middle" font-size="9" fill="var(--text2)" font-family="-apple-system,sans-serif" letter-spacing="1">CLEAN</text></svg><span>Share of electricity<br/>from renewables &amp; nuclear</span></div>`;
      const bars=`<div class="energy-bars">${R.bars.map(b=>`<div class="ebar-row"><span class="ebar-label">${b[0]}</span><div class="ebar-track"><div class="ebar-fill" style="width:${b[1]}%;background:${b[2]}"></div></div><span class="ebar-pct">${b[1]}%</span></div>`).join('')}</div>`;
      s+=`<p class="section-label">Energy Profile</p><p class="section-text">${R.energyOverview}</p><div class="energy-layout">${radial}${bars}</div>${R.energyNote?`<p class="section-text" style="margin-top:1.25rem">${R.energyNote}</p>`:''}`;
    }else s+=notYet('Energy Profile');

    // Emissions
    if(R){
      const mx=Math.max(R.ghgValue,WORLD_AVG)*1.3;
      const cp=(R.ghgValue/mx*100).toFixed(0);
      const wp=(WORLD_AVG/mx*100).toFixed(0);
      const below=R.ghgValue<WORLD_AVG;
      s+=`<p class="section-label">Emissions</p><p class="section-text">${R.emissionsText}</p>
      <div class="emissions-grid">
        <div class="em-stat-card"><div class="em-stat-number">${R.ghgValue}t</div><div class="em-stat-unit">CO2e per capita</div><div class="em-stat-label">Total greenhouse gas emissions (UNEP 2024)</div></div>
        <div class="em-stat-card"><div class="em-stat-number" style="color:${below?'#1a7a3a':'#a32d2d'}">${below?'↓ '+(WORLD_AVG-R.ghgValue).toFixed(1)+'t':'↑ '+(R.ghgValue-WORLD_AVG).toFixed(1)+'t'}</div><div class="em-stat-unit">vs. global average (${WORLD_AVG}t)</div><div class="em-stat-label">${below?'Below':'Above'} the world average per capita</div></div>
        <div class="em-compare"><h4>Per Capita Comparison (CO2e)</h4>
          <div class="cbar-row"><div class="cbar-top"><span>${name}</span><strong>${R.ghgValue}t</strong></div><div class="cbar-track"><div class="cbar-fill" style="width:${cp}%;background:var(--acm)"></div></div></div>
          <div class="cbar-row" style="margin-top:.5rem"><div class="cbar-top"><span>Global Average</span><strong>${WORLD_AVG}t</strong></div><div class="cbar-track"><div class="cbar-fill" style="width:${wp}%;background:var(--text2);opacity:.45"></div></div></div>
        </div>
        <div class="em-sector"><h4>Emissions by Sector</h4><div class="sector-bars">${R.sectors.map(sec=>`<div class="sector-row"><span class="sector-label">${sec[0]}</span><div class="sector-track"><div class="sector-fill" style="width:${sec[1]}%;background:${sec[2]}"></div></div><span class="sector-pct">${sec[1]}%</span></div>`).join('')}</div></div>
      </div>`;
    }else s+=notYet('Emissions');

    // Threats
    if(R){
      s+=`<p class="section-label">Climate Threats</p><div class="threat-grid">${R.threats.map(t=>`<div class="threat-card"><div class="threat-body">${t.stat?`<div class="threat-stat">${t.stat}</div><div style="font-size:11px;color:var(--acm);font-weight:500;letter-spacing:.03em;text-transform:uppercase;margin-bottom:.5rem">${t.statLabel}</div>`:''}<h4>${t.title}</h4><p>${t.text}</p></div></div>`).join('')}</div>`;
    }else s+=notYet('Climate Threats');

    // Government timeline
    if(R){
      s+=`<p class="section-label">Government & Policy</p><div class="gov-timeline">${R.government.map(g=>`<div class="gov-item"><div class="gov-dot"></div><div class="gov-year">${g.year}</div><div class="gov-title">${g.title}</div><div class="gov-text">${g.text}</div></div>`).join('')}</div><p class="section-text" style="margin-top:1.5rem">See <a href="watch.html" style="color:var(--acm)">The Watch</a> for ongoing US federal actions on energy and climate.</p>`;
    }else s+=notYet('Government & Policy');

    // Initiatives
    if(R){
      s+=`<p class="section-label">Initiatives</p><div class="init-cards">${R.initiatives.map(i=>`<div class="init-card"><div class="init-card-top"><div class="init-icon">${svgIcon(i.icon)}</div><div class="init-card-title">${i.title}</div></div><p class="init-card-text">${i.text}</p>${i.numbers.length?`<div class="init-numbers">${i.numbers.map(n=>`<div class="init-num"><strong>${n.val}</strong><span>${n.label}</span></div>`).join('')}</div>`:''}${i.progress!==null?`<div class="init-progress"><div class="init-progress-top"><span>Funds mobilized</span><span>${i.progress}%</span></div><div class="init-progress-track"><div class="init-progress-fill" style="width:${i.progress}%"></div></div></div>`:''}</div>`).join('')}</div>`;
    }else s+=notYet('Initiatives');

    // People
    if(R){
      s+=`<p class="section-label">Remarkable People</p><div class="people-grid">${R.people.map(p=>`<div class="person-card"><div class="person-img-wrap"><div class="person-avatar-fallback" id="av_${p.initials}">${p.initials}</div></div><div class="person-body"><h4>${p.name}</h4><p class="person-role">${p.role}</p><p>${p.bio}</p></div></div>`).join('')}</div>`;
    }else s+=notYet('Remarkable People');

    // Orgs
    if(R){
      s+=`<p class="section-label">Organizations</p><div class="org-grid">${R.orgs.map(o=>`<div class="org-card"><div class="org-logo-wrap"><img class="org-logo" src="https://www.google.com/s2/favicons?sz=128&domain=${o.domain}" alt="${o.name} logo" onerror="this.style.display='none'"/></div><div class="org-info"><a href="${o.url}" target="_blank">${o.fullName}</a><p>${o.desc}</p><span class="tag">${o.scale}</span></div></div>`).join('')}</div><p class="section-text" style="margin-top:1rem">See <a href="action.html" style="color:var(--acm)">Take Action</a> for more organizations working on clean energy and climate globally.</p>`;
    }else s+=notYet('Organizations');

    // Did You Know
    if(R){
      s+=`<p class="section-label">Did You Know</p><div class="fact-grid">${R.facts.map(f=>`<div class="fact-card"><div class="fact-num">${f.num}</div><div style="font-size:11px;font-weight:600;color:var(--acm);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.5rem">${f.unit}</div><p>${f.text}</p></div>`).join('')}</div>`;
    }

    const sources=R?`<p class="source-note">Sources: ${R.sources}</p>`:'';

    page.innerHTML=`
      <div class="breadcrumb"><a href="index.html#explore">Explore</a> <span>&#8250;</span> <span>${name}</span></div>
      <div class="header">
        <div class="header-main">
          ${flagHtml}
          <h1>${name}</h1>
          <p class="header-overview">${overview}</p>
          <div class="header-stats">${statsHtml}</div>
        </div>
        <div class="header-map-wrap">
          <div class="header-map"><div id="countryMap"></div></div>
          <p class="map-caption">Hover provinces to see region names</p>
        </div>
      </div>
      <div class="container">${s}${sources}<a href="index.html#explore" class="back-link">&#8592; Back to the Map</a></div>
    `;

    // Mini map — full world tiles, country highlighted, provinces from Natural Earth ADM1
    // Defer map init until DOM has updated after page.innerHTML assignment
    setTimeout(()=>{
    const cm=L.map('countryMap',{zoomControl:true,dragging:true,scrollWheelZoom:true,doubleClickZoom:true,touchZoom:true,attributionControl:false});
    L.tileLayer(isDark?'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:12}).addTo(cm);

    // World context (non-interactive, neutral)
    L.geoJson(worldData,{
      style:f=>{
        const same=getCode(f.properties)===id;
        return same?{fillColor:'transparent',fillOpacity:0,color:'transparent',weight:0}:{fillColor:isDark?'#3f4654':'#94a3b8',fillOpacity:isDark?.14:.07,color:isDark?'#5b6472':'#94a3b8',weight:.5,opacity:.5};
      },
      smoothFactor:.6,interactive:false
    }).addTo(cm);

    // Country highlight
    const hl=L.geoJson(feat,{style:{fillColor:isDark?'#5b9de8':'#2d6ec2',fillOpacity:.28,color:isDark?'#8cc0f5':'#1a4a8a',weight:2},interactive:false}).addTo(cm);
    try{cm.fitBounds(hl.getBounds(),{padding:[20,20]});}catch(e){cm.setView([20,10],2);}
    setTimeout(()=>cm.invalidateSize(),50);

    // Province overlay from Natural Earth ADM1 (same source as main map)
    fetch('https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/50m/cultural/ne_50m_admin_1_states_provinces.json')
      .then(r=>r.json())
      .then(adm1=>{
        const provs=adm1.features.filter(f=>(f.properties.iso_a2||'').toUpperCase()===(iso2||'').toUpperCase()||f.properties.adm0_a3===id);
        if(!provs.length)return;
        L.geoJson({type:'FeatureCollection',features:provs},{
          style:{fillColor:'#ffffff',fillOpacity:0.01,color:isDark?'rgba(255,255,255,.45)':'rgba(26,74,138,.5)',weight:.8},
          onEachFeature:(f,layer)=>{
            const pname=f.properties.name||f.properties.name_en||'Region';
            layer.bindTooltip(pname,{className:'province-tooltip',sticky:true,direction:'top'});
            layer.on({
              mouseover(){layer.setStyle({fillColor:isDark?'#5b9de8':'#2d6ec2',fillOpacity:.22,weight:1.4})},
              mouseout(){layer.setStyle({fillColor:'#ffffff',fillOpacity:0.01,weight:.8})}
            });
          }
        }).addTo(cm);
      })
      .catch(()=>{});
    },50); // end setTimeout — lets page.innerHTML settle before Leaflet mounts

    // Note: real photos were tried via Wikipedia's API but proved unreliable
    // (wrong person matched, poor crops). Sticking with initials avatars
    // for consistency and accuracy.

  })
  .catch(()=>{
    page.innerHTML='<div class="not-found"><h1>Unable to load map data</h1><p>This will work on GitHub Pages. <a href="index.html#explore" class="back-link">&#8592; Back</a></p></div>';
  });
}
</script>
</body>
</html>
